name: wifite4 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on all scripts
        run: |
          set -euo pipefail
          shopt -s globstar
          for f in **/*.sh; do
            echo "Checking: $f"
            shellcheck -x "$f"
          done

      - name: Mock-mode test — stub aircrack-ng tools and exercise parsing
        run: |
          set -euo pipefail
          MOCK_DIR=$(mktemp -d)
          export PATH="$MOCK_DIR:$PATH"
          for t in airmon-ng hcxdumptool hashcat hcxpcapngtool hcxhashtool airodump-ng mdk4 reaver bettercap hostapd-mana wifiphisher macchanger iw jq xxd comm sort bully wash kismet tshark dnsmasq nmap; do printf '#!/usr/bin/env bash\nexit 0\n' > "$MOCK_DIR/$t" && chmod +x "$MOCK_DIR/$t"; done
          printf '#!/usr/bin/env bash\n/usr/bin/grep "$@"\n' > "$MOCK_DIR/grep" && chmod +x "$MOCK_DIR/grep"

          echo "=== Exercise parsing logic (safe modes) ==="
          bash autopwn-ng.sh --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --dry-run"
          bash autopwn-ng.sh --simulate >/dev/null
          echo "OK: autopwn-ng.sh --simulate"
          bash autopwn-ng.sh -p stealth -t 300 --dry-run >/dev/null
          echo "OK: autopwn-ng.sh -p stealth -t 300 --dry-run"
          bash autopwn-ng.sh --resume --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --resume --dry-run"
          bash autopwn-ng.sh --auto --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --auto --dry-run"
          bash autopwn-ng.sh --pmkid-only --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --pmkid-only --dry-run"
          bash autopwn-ng.sh --no-harvest --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --no-harvest --dry-run"
          bash autopwn-ng.sh --harvest-time 10 --dry-run >/dev/null
          echo "OK: autopwn-ng.sh --harvest-time 10 --dry-run"
          bash autopwn-ng.sh --help >/dev/null
          echo "OK: autopwn-ng.sh --help"
          bash autopwn-ng.sh --parse-pcap /dev/null >/dev/null 2>&1 || true
          echo "OK: autopwn-ng.sh --parse-pcap"
          bash setup.sh --help >/dev/null
          echo "OK: setup.sh --help"
          WIFITE4_TEST_MODE=1 WIFITE4_PREFIX="$MOCK_DIR/prefix" bash setup.sh --only-autopwn >/dev/null
          echo "OK: setup.sh --only-autopwn"
          bash setup.sh --only-autopwn --dry-run >/dev/null
          echo "OK: setup.sh --only-autopwn --dry-run"
          bash setup.sh --dry-run >/dev/null
          echo "OK: setup.sh --dry-run"
          bash setup.sh --quick --dry-run >/dev/null
          echo "OK: setup.sh --quick --dry-run"
          bash install-autopwn-ng.sh --help >/dev/null
          echo "OK: install-autopwn-ng.sh --help"
          bash install-autopwn-ng.sh --dry-run >/dev/null
          echo "OK: install-autopwn-ng.sh --dry-run"

          echo "✓ Mock-mode syntax and parsing checks passed"
          rm -rf "$MOCK_DIR"

      - name: Install path smoke test (dry-run)
        run: |
          set -euo pipefail
          bash setup.sh --dry-run
          echo "OK: setup.sh --dry-run"
          bash setup.sh --quick --dry-run
          echo "OK: setup.sh --quick --dry-run"
          bash install-autopwn-ng.sh --dry-run
          echo "OK: install-autopwn-ng.sh --dry-run"

      - name: Unit tests — argument parsing and profile selection
        run: |
          set -euo pipefail
          bash tests/test-autopwn-ng.sh

      - name: Integration tests — mocked tools & flag combinations
        run: |
          set -euo pipefail
          bash tests/test-integration.sh

      - name: Rerun / idempotency mock test
        run: |
          set -euo pipefail
          bash tests/test-rerun.sh
